<!DOCTYPE html>

<html class="aquarium-page" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aquarium</title>
<link href="Style.css?v=20261010-workspace7" rel="stylesheet"/>
<script defer="" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer="" src="CloudSync.js?v=20261010-workspace7"></script>
<script defer src="Activity.js?v=20261010-recent9"></script>
<script defer="" src="Script.js?v=20261010-workspace7"></script>
<link href="Planner.css?v=20261010-month9" rel="stylesheet"/>
<script defer="" src="Planner.js?v=20261010-month9"></script>
<link rel="stylesheet" href="Workspace.css?v=20261010-archive9">
<script defer src="Workspace.js?v=20261010-archive9"></script>
</head>
<body data-default-theme="aquarium">
<div class="aq-page" id="aquariumApp">
<header class="aq-header">
<div class="aq-brand">
<div aria-hidden="true" class="pi-mark">🪼</div>
<div class="aq-title">
<h1 data-pi-ui="aquarium-page-title-v2" data-pi-ui-fallback="Aquarium">Aquarium</h1>
</div>
</div>
<div class="aq-header-actions">
<span aria-live="polite" class="sync-status" id="saveStatus">cloud ready</span><details class="ecosystem-menu">
<summary>pages</summary>
<nav aria-label="Open another page" class="ecosystem-menu-popover">
<a href="Database.html">⌂ Home</a>
<a aria-current="page" class="current" href="Aquarium.html">🪼 Aquarium</a>
<a href="Longform.html">✎ Longform</a>
<a href="Week.html">🗓️ This Week</a>
<a href="Month.html">📅 This Month</a>
<a href="Almanac.html">◷ Timeline</a>
<a href="Patterns.html">🧭 Archive</a>
<a href="neopets.html">✦ Neopets</a>
</nav>
</details><select aria-label="Theme" class="theme-select" id="themeSelect">
<optgroup label="Dark themes">
<option value="dark">🌙 Dark Original</option>
<option value="aquarium">🐠 Dark Teal Celestial Aquarium</option>
<option value="observatory">🔭 Midnight Observatory</option>
<option value="nightgarden">🪻 Night Garden</option>
<option value="fieldnotes">📓 Universal Field Notes</option>
</optgroup>
<optgroup label="Retro themes">
<option value="y2k">🖥️ Y2K Web Portal</option>
</optgroup>
<optgroup label="Light themes">
<option value="cozy">💿 Cozy 2000s</option>
<option value="green">🌿 Full Green</option>
<option value="fall">🍂 Fall</option>
<option value="fall2">🍁 Fall 2</option>
<option value="study">📜 Study</option>
</optgroup>
</select><details class="ecosystem-menu pi-tools-menu"><summary>tools</summary><div class="pi-tools-popover"><button type="button" class="small-button" data-pi-open-inbox>inbox</button><button class="small-button cloud-login-button" id="cloudLoginButton" type="button">cloud login</button><button class="small-button selection-mode-button" id="selectModeButton" type="button">select</button><button class="small-button selection-action-button" hidden="" id="selectionActionButton" type="button">archive selected</button><button class="small-button" id="archiveDone">archive completed</button></div></details></div>
</header>
<section class="link-strip database-global-links">
<div class="link-strip-label editable-ui" contenteditable="true" data-ui-save="links-title">🔗 Links</div>
<div class="links-container" id="linksContainer"></div>
<button class="link-add-button" id="addLinkButton" title="Add a new link" type="button">+ link</button>
</section>
<div class="aq-workspace">
<main class="aq-board-workspace">
<div class="aq-section-board" id="categoryGrid"></div>
<div class="aq-footer-note">
</div>
</main>
<div class="aq-capture-column">
<div class="aq-board-tools aq-capture-tools">
<label class="aq-filter-dropdown">
<span>show</span>
<select aria-label="Filter Aquarium cards" id="aqFilterSelect">
<option value="all">All types</option>
</select>
</label>
<button class="small-button" id="addAquariumSection" type="button">+ section</button>
</div>
<aside class="aq-panel aq-capture-panel" data-collapsible-panel="aquarium-capture">
<div class="aq-panel-head">
<div class="aq-title-wrap">
<span class="aq-section-icon">✧</span>
<div>
<div class="aq-panel-title editable-ui" contenteditable="true" data-pi-ui="aquarium-capture-title" data-pi-ui-fallback="Brain Dump">Brain Dump</div>
</div>
</div>
</div>
<div class="aq-capture-body" data-collapse-body="">
<input aria-label="Aquarium note title" autocomplete="off" class="aq-capture-title-input" id="aqCaptureTitle" maxlength="180" placeholder="Title this thought…" type="text"/>
<div aria-multiline="true" class="aq-capture-rich-input" contenteditable="true" data-placeholder="Let the thought take up the space it needs. Ctrl/Cmd + B, I, U work here too." id="captureInput" role="textbox"></div>
<div class="aq-kind-select-row">
<label class="aq-kind-select-label">
<span>type</span>
<select aria-label="Aquarium card type" id="aqCaptureKind"></select>
</label>
<button class="small-button" id="manageAquariumKinds" type="button">manage types</button>
</div>
<div class="aq-capture-row">
<span class="aq-shortcut">Ctrl/Cmd + Enter saves · plain Enter stays in the thought</span>
<button class="aq-primary-button" id="captureBtn">add to inbox</button>
</div>
</div>
<div class="aq-inbox-zone aq-dropzone" data-collapse-body="" data-zone="inbox" id="inboxZone"></div>
</aside>
</div>
</div>
</div>
<div aria-hidden="true" class="link-editor-backdrop" id="linkEditorBackdrop">
<div aria-labelledby="linkEditorTitle" aria-modal="true" class="link-editor" role="dialog">
<h2 id="linkEditorTitle">Edit Link</h2>
<label for="linkLabelInput">Label</label>
<input id="linkLabelInput" type="text"/>
<label for="linkUrlInput">URL or local file</label>
<input id="linkUrlInput" placeholder="example.html or https://..." type="text"/>
<div class="link-editor-actions">
<button id="cancelLinkEdit" type="button">Cancel</button>
<button id="saveLinkEdit" type="button">Save</button>
</div>
</div>
</div>
</body>
</html>
