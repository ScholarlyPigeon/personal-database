<body data-default-theme="aquarium" class="aq-folder-layout">
<div class="aq-page" id="aquariumApp">
<header class="aq-header">
<div class="aq-brand">
<div aria-hidden="true" class="pi-mark">🪼</div>
<div class="aq-title">
<h1>Aquarium · Folders</h1>
</div>
</div>
<div class="aq-header-actions"><span aria-live="polite" class="sync-status" id="saveStatus">cloud ready</span><select aria-label="Theme" class="theme-select" id="themeSelect"></select><details class="ecosystem-menu">
<summary>pages</summary>
<nav aria-label="Open another page" class="ecosystem-menu-popover"><a href="Database.html">🏠 Home</a><a href="Aquarium.html">🪼 Aquarium</a><a aria-current="page" class="current" href="AquariumFolders.html">🗂 Aquarium · Folders</a><a href="Longform.html">✎ Longform</a><a href="Compass.html">🧭 Compass</a><a href="Alignment.html">✨ Alignment</a><a href="Week.html">🗓️ This Week</a><a href="Month.html">📅 This Month</a><a href="NextMonth.html">📆 Next Month</a><a href="Almanac.html">◷ Timeline</a><a href="Patterns.html">🗂 Archive</a><a href="neopets.html">✦ Neopets</a></nav>
</details><details class="ecosystem-menu pi-tools-menu"><summary>tools</summary><div class="pi-tools-popover"><button class="small-button cloud-login-button" id="cloudLoginButton" type="button">cloud login</button><button class="small-button selection-mode-button" id="selectModeButton" type="button">select</button><button class="small-button selection-action-button" hidden="" id="selectionActionButton" type="button">archive selected</button><button class="small-button" id="archiveDone">archive completed</button></div></details></div>
</header>
<section class="link-strip database-global-links">
<div class="link-strip-label editable-ui" contenteditable="true" data-ui-save="links-title">🔗 Links</div>
<div class="links-container" id="linksContainer"></div>
<button class="link-add-button" id="addLinkButton" title="Add a new link" type="button">+ link</button>
</section>
<div class="aq-workspace aq-folder-workspace">
  <aside class="aq-folder-dashboard aq-panel" aria-label="Dashboard">
    <div class="aq-panel-head"><div class="aq-title-wrap"><span class="aq-section-icon">✧</span><div><div class="aq-panel-title">Dashboard</div></div></div></div>
    <div class="aq-inbox-zone aq-dropzone aq-dashboard-list" data-zone="inbox" id="inboxZone"></div>
  </aside>
  <main class="aq-board-workspace aq-folder-board">
    <div class="aq-folder-heading"><strong>Folders</strong><button type="button" class="small-button" id="aqFoldersAddSection">+ section</button></div>
    <div class="aq-section-board" id="categoryGrid"></div>
  </main>
  <div class="aq-capture-column aq-folder-capture">
    <aside class="aq-panel aq-capture-panel" data-collapsible-panel="aquarium-capture">
      <div class="aq-panel-head"><div class="aq-title-wrap"><span class="aq-section-icon">✎</span><div><div class="aq-panel-title editable-ui" contenteditable="true" data-pi-ui="aquarium-capture-title" data-pi-ui-fallback="Brain Dump">Brain Dump</div></div></div></div>
      <div class="aq-capture-body" data-collapse-body="">
        <input aria-label="Aquarium note title" autocomplete="off" class="aq-capture-title-input" id="aqCaptureTitle" maxlength="180" placeholder="Title your thought…" type="text"/>
        <div aria-multiline="true" aria-label="Write a thought" class="aq-capture-rich-input" contenteditable="true" data-placeholder=". . ." id="captureInput" role="textbox"></div>
        <div class="aq-capture-row"><button class="aq-primary-button" id="captureBtn">Save to Dashboard ↑</button></div>
      </div>
    </aside>
  </div>
</div>
</div>
<dialog class="aq-folder-dialog" id="aqFolderDialog" aria-label="Aquarium folder contents">
  <div class="aq-folder-dialog-top"><span class="aq-folder-dialog-symbol" aria-hidden="true">✧</span><input id="aqFolderDialogName" maxlength="120" aria-label="Folder name"/><button class="aq-folder-icon-button" type="button" id="aqFolderDialogClose" aria-label="Close folder">×</button></div>
  <textarea id="aqFolderDialogDescription" rows="2" maxlength="500" placeholder="A little description…" aria-label="Folder description"></textarea>
  <div class="aq-folder-dialog-tools"><span id="aqFolderDialogCount">0 notes</span><button type="button" class="small-button" id="aqFolderDialogAdd">+ note</button></div>
  <form id="aqFolderDialogForm" class="aq-folder-inline-form" hidden>
    <input id="aqFolderNewTitle" type="text" maxlength="180" placeholder="Note title…" aria-label="Note title"/>
    <div id="aqFolderNewBody" class="aq-folder-inline-body" role="textbox" contenteditable="true" aria-multiline="true" data-placeholder="Write your note…" aria-label="Note text"></div>
    <div class="aq-folder-inline-actions"><button class="small-button" type="button" id="aqFolderNewCancel">Cancel</button><button class="aq-primary-button" type="submit">Save note</button></div>
  </form>
  <div class="aq-folder-dialog-notes aq-dropzone" id="aqFolderDialogNotes" aria-label="Notes in folder"></div>
</dialog>
<div aria-hidden="true" class="link-editor-backdrop" id="linkEditorBackdrop">
<div aria-labelledby="linkEditorTitle" aria-modal="true" class="link-editor" role="dialog">
<h2 id="linkEditorTitle">Edit Link</h2>
<label for="linkLabelInput">Label</label>
<input id="linkLabelInput" type="text"/>
<label for="linkUrlInput">URL or local file</label>
<input id="linkUrlInput" placeholder="example.html or https://..." type="text"/>
<div class="link-editor-actions">
<button id="cancelLinkEdit" type="button">Cancel</button>
<button id="saveLinkEdit" type="button">Save</button>
</div>
</div>
</div>
