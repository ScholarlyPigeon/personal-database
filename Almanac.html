<body class="pi-reflections-body" data-default-theme="study">
<div class="pi-reflections-page" id="almanacApp"><header class="almanac-header">
<div class="brand">
<div aria-hidden="true" class="pi-mark">📖</div>
<div>
<h1>Timeline &amp; Notes</h1>
</div>
</div>
<div class="header-right almanac-header-actions"><span aria-live="polite" class="sync-status" id="saveStatus">cloud ready</span><select aria-label="Theme" class="theme-select" id="themeSelect"></select><details class="ecosystem-menu">
<summary>pages</summary>
<nav aria-label="Open another page" class="ecosystem-menu-popover"><a href="Database.html">⌂ Home</a><a href="Aquarium.html">🪼 Aquarium</a><a href="Longform.html">✎ Longform</a><a href="Compass.html">🧭 Compass</a><a href="Week.html">🗓️ This Week</a><a href="Month.html">📅 This Month</a><a aria-current="page" class="current" href="Almanac.html">◷ Timeline</a><a href="Patterns.html">🗂 Archive</a><a href="neopets.html">✦ Neopets</a></nav>
</details><details class="ecosystem-menu pi-tools-menu"><summary>tools</summary><div class="pi-tools-popover"><button class="small-button" data-pi-open-inbox="" type="button">inbox</button><button class="small-button cloud-login-button" id="cloudLoginButton" type="button">cloud login</button></div></details></div>
</header>
<main aria-label="Timeline and writing workspace" class="pi-reflections-grid" id="piReflections">
<section class="pi-workspace-panel"><div class="pi-workspace-head"><h2>📍 Timeline</h2><div class="pi-workspace-actions"><span class="pi-archive-count" id="piTimelineCount">0</span><button class="pi-workspace-quiet" id="piRecoverTimeline" title="Merge Timeline items from an older backup" type="button">recover</button></div></div><div class="pi-workspace-scroll" id="piTimelineList"></div>
<div class="pi-timeline-add"><input aria-label="New timeline title" id="piTimelineTitle" maxlength="180" placeholder="New milestone title…"/><textarea aria-label="New timeline details" id="piTimelineBody" placeholder="Optional details…" rows="2"></textarea><div class="pi-timeline-add-row"><input aria-label="Milestone date" id="piTimelineDate" type="date"/><button class="pi-workspace-quiet" id="piAddTimeline" type="button">+ milestone</button></div></div>
<input accept=".json,application/json" hidden="" id="piTimelineBackupInput" type="file"/>
</section>
<section class="pi-workspace-panel"><div class="pi-workspace-head"><h2>✎ Write it Out</h2><span class="pi-muted">rich-text notes</span></div><div class="pi-workspace-form">
<label>Title<input id="piNoteTitle" maxlength="180" placeholder="Title this note…" type="text"/></label>
<div class="pi-workspace-form-row"><label>Section<select id="piNoteSection"></select></label><label>Date<input id="piNoteDate" type="date"/></label></div>
<label for="piNoteEditor">Your note</label><div aria-multiline="true" class="pi-note-editor" contenteditable="true" data-placeholder="Let the thought take up the space it needs. Ctrl/Cmd + B, I and U work here." id="piNoteEditor" role="textbox"></div>
<details class="pi-note-attach"><summary>optional image / link</summary><div><label>Image URL<input id="piNoteImageUrl" placeholder="https://…" type="url"/></label><label>Clickable link<input id="piNoteLinkUrl" placeholder="https://…" type="url"/></label></div></details>
<div class="pi-form-foot"><span class="pi-muted">Ctrl/Cmd + Enter saves</span><button class="pi-primary" id="piSaveNote" type="button">Save note ↑</button></div></div></section>
<section class="pi-workspace-panel pi-saved-notes-panel"><div class="pi-workspace-head"><h2>▤ Saved Notes</h2><div class="pi-workspace-actions"><span class="pi-archive-count" id="piNoteCount">0</span><button class="pi-workspace-quiet" id="piAddNoteSection" type="button">+ section</button></div></div><div class="pi-workspace-scroll" id="piSavedNoteList"></div></section>
</main>
</div></body></html>
